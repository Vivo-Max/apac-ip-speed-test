name: IP Filter Speedtest API Workflow

on:
  workflow_dispatch:
    inputs:
      offline_mode:
        description: 'Run in offline mode (skip GeoIP database download)'
        required: false
        type: boolean
        default: true
      update_geoip:
        description: 'Force update GeoIP database'
        required: false
        type: boolean
        default: false

env:
  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
  PYTHON_VERSION: '3.10'

jobs:
  run-ip-tester:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache output files
      id: cache-output
      uses: actions/cache@v4
      with:
        path: |
          ip.csv
          ip.txt
          ips.txt
          GeoLite2-Country.mmdb
        key: ${{ runner.os }}-output-${{ hashFiles('input.csv', 'ip.txt') }}
        restore-keys: |
          ${{ runner.os }}-output-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git openssh-client

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests charset-normalizer geoip2==4.8.0 maxminddb>=2.0.0 packaging>=21.3 fake-useragent

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global --add safe.directory $PWD
        echo "Git configuration set"

    - name: Make scripts executable
      run: |
        if [ -f ip-filter-speedtest-api.py ]; then
          chmod +x ip-filter-speedtest-api.py
          ls -l ip-filter-speedtest-api.py
        else
          echo "Error: ip-filter-speedtest-api.py not found"
          exit 1
        fi
        if [ -f iptest.sh ]; then
          chmod +x iptest.sh
          ls -l iptest.sh
        else
          echo "Error: iptest.sh not found"
          exit 1
        fi
        if [ -f iptest ]; then
          chmod +x iptest
          ls -l iptest
        else
          echo "Error: iptest binary not found"
          exit 1
        fi

    - name: Check GeoIP database
      run: |
        if [ -f GeoLite2-Country.mmdb ]; then
          echo "GeoLite2-Country.mmdb exists, size: $(ls -lh GeoLite2-Country.mmdb | awk '{print $5}')"
        else
          echo "Warning: GeoLite2-Country.mmdb not found, relying on offline mode"
        fi

    - name: Check input changes
      id: check-input
      run: |
        if [ -f input.csv ]; then
          CURRENT_HASH=$(sha256sum input.csv | awk '{print $1}')
          echo "Current input.csv hash: $CURRENT_HASH"
          if [ -f .input_hash ]; then
            PREV_HASH=$(cat .input_hash)
            echo "Previous input.csv hash: $PREV_HASH"
            if [ "$CURRENT_HASH" = "$PREV_HASH" ] && [ -f ip.csv ] && [ -f ip.txt ] && [ -f ips.txt ]; then
              echo "Input unchanged and output files exist, skipping speed test"
              echo "skip_speed_test=true" >> $GITHUB_OUTPUT
            else
              echo "Input changed or output files missing, running speed test"
              echo "skip_speed_test=false" >> $GITHUB_OUTPUT
              echo "$CURRENT_HASH" > .input_hash
            fi
          else
            echo "No previous hash, running speed test"
            echo "skip_speed_test=false" >> $GITHUB_OUTPUT
            echo "$CURRENT_HASH" > .input_hash
          fi
        else
          echo "input.csv not found, running speed test"
          echo "skip_speed_test=false" >> $GITHUB_OUTPUT
        fi

    - name: Run IP tester script
      id: run-script
      if: steps.check-input.outputs.skip_speed_test != 'true'
      run: |
        echo "Running IP tester script..."
        echo "MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-'Not set'}"
        echo "Offline mode: ${{ github.event.inputs.offline_mode }}"
        echo "Update GeoIP: ${{ github.event.inputs.update_geoip }}"
        python -u ip-filter-speedtest-api.py \
          $([[ "${{ github.event.inputs.offline_mode }}" == "true" ]] && echo "--offline") \
          $([[ "${{ github.event.inputs.update_geoip }}" == "true" ]] && echo "--update-geoip") \
          || echo "IP tester script exited with non-zero code, proceeding to check outputs"
      env:
        MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        GITHUB_ACTIONS: true

    - name: Check for output files
      if: steps.run-script.outcome == 'success' || steps.check-input.outputs.skip_speed_test == 'true'
      run: |
        if [ ! -f ip.csv ] || [ ! -f ip.txt ] || [ ! -f ips.txt ]; then
          echo "Error: Output files (ip.csv, ip.txt, or ips.txt) not found."
          exit 1
        fi
        ls -l ip.csv ip.txt ips.txt
        echo "Output files verified"

    - name: Commit and push results
      if: steps.run-script.outcome == 'success' || steps.check-input.outputs.skip_speed_test == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git add ip.csv ip.txt ips.txt .input_hash
        git commit -m "Update IP test results [skip ci]" || echo "No changes to commit"
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }} || echo "No changes to push"
        echo "Commit and push completed"

    - name: Upload results as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ip-test-results
        path: |
          ip.csv
          ip.txt
          ips.txt
        if-no-files-found: error
